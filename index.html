<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عالم الألعاب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --primary: #E6473C; --primary-dark: #c0392b; --primary-light: #ff6b5a;
        --green: #4CAF7D; --green-dark: #3a8a63;
        --blue: #3D8BD4; --blue-dark: #2d6ba4;
        --yellow: #FFC93C; --yellow-dark: #d9a52a;
        --mafia: #5B2C6F; --mafia-dark: #3d1d4a;
        --bg-gradient: linear-gradient(145deg, #f5f0eb 0%, #e8dfd7 100%);
        --ink: #1B1B1B;
        --shadow: 0 20px 60px rgba(0,0,0,0.15);
        --radius: 30px;
        --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
        font-family: 'Cairo', sans-serif; background: var(--bg-gradient); color: var(--ink);
        display: flex; flex-direction: column; align-items: center;
        padding: 20px 16px 40px; min-height: 100vh; overflow-x: hidden;
    }
    .top-bar { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
    .top-bar-right, .top-bar-left { display: flex; gap: 8px; align-items: center; }
    .theme-btn { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 1rem; padding: 6px 10px; border: 2px solid var(--ink); border-radius: 30px; cursor: pointer; background: #fff; color: var(--ink); box-shadow: 0 4px 0 var(--ink); transition: var(--transition); line-height: 1; min-width: 38px; }
    .theme-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
    body.theme-transitioning, body.theme-transitioning * { transition: background-color 0.3s ease, color 0.25s ease, border-color 0.3s ease, box-shadow 0.3s ease !important; }
    .sound-btn { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 0.8rem; padding: 6px 12px; border: 2px solid var(--ink); border-radius: 30px; cursor: pointer; background: #fff; color: var(--ink); box-shadow: 0 4px 0 var(--ink); transition: var(--transition); }
    .sound-btn.active { background: var(--green); color: #fff; border-color: var(--green); }
    .sound-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
    .logout-btn-top { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 0.8rem; padding: 6px 12px; border: 2px solid var(--ink); border-radius: 30px; cursor: pointer; background: var(--primary); color: #fff; box-shadow: 0 4px 0 var(--primary-dark); transition: var(--transition); display: none; }
    .logout-btn-top.visible { display: block; }
    .logout-btn-top:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--primary-dark); }
    .connection-badge { font-size: 0.7rem; font-weight: 700; padding: 4px 12px; border-radius: 30px; background: #fff; border: 1.5px solid var(--ink); display: flex; align-items: center; gap: 5px; }
    .connection-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse-dot 1.5s infinite; }
    @keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.85); } }
    .app { width: 100%; max-width: 480px; }

    .auth-screen { display: flex; align-items: center; justify-content: center; min-height: 85vh; padding: 10px 0; position: relative; animation: fadeInUp 0.45s ease; }
    .auth-screen::before, .auth-screen::after { content: ''; position: fixed; border-radius: 50%; filter: blur(70px); opacity: 0.30; pointer-events: none; z-index: 0; }
    .auth-screen::before { width: 250px; height: 250px; background: var(--primary); top: -70px; right: -80px; animation: blobFloat 9s ease-in-out infinite; }
    .auth-screen::after { width: 290px; height: 290px; background: var(--blue); bottom: -90px; left: -100px; animation: blobFloat 11s ease-in-out infinite reverse; }
    @keyframes blobFloat { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-22px, 26px) scale(1.15); } }
    .auth-card { position: relative; z-index: 1; background: #fff; border-radius: 34px; box-shadow: var(--shadow), 0 0 0 2px var(--ink), 0 10px 0 var(--ink); padding: 26px 24px 22px; width: 100%; max-width: 400px; text-align: center; overflow: hidden; animation: cardPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes cardPop { from { opacity: 0; transform: scale(0.92) translateY(22px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .auth-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 8px; background: repeating-linear-gradient(115deg, var(--primary) 0 22px, var(--yellow) 22px 44px, var(--green) 44px 66px, var(--blue) 66px 88px); opacity: 0.9; }
    .auth-card::after { content: '🎬 🍿 🎮 🕹️'; position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 3.2rem; opacity: 0.05; white-space: nowrap; pointer-events: none; }
    .auth-logo { width: 86px; height: 86px; margin: 6px auto 14px; border-radius: 28px; background: linear-gradient(145deg, var(--primary-light), var(--primary)); border: 2px solid var(--ink); box-shadow: 0 8px 0 var(--ink); display: flex; align-items: center; justify-content: center; font-size: 2.6rem; position: relative; animation: float 3.6s ease-in-out infinite; }
    .auth-logo::after { content: ''; position: absolute; inset: 6px; border-radius: 20px; border: 2px dashed rgba(255,255,255,0.5); }
    .auth-card .brand { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 2.1rem; margin: 0 0 4px; color: var(--ink); position: relative; line-height: 1.2; }
    .auth-card .brand span { color: var(--primary); }
    .auth-card .sub { font-weight: 600; color: #6b625a; margin-bottom: 18px; font-size: 0.92rem; line-height: 1.6; position: relative; }
    .auth-tabs { display: flex; gap: 5px; background: #f1eae1; border: 2px solid var(--ink); border-radius: 50px; padding: 5px; margin-bottom: 18px; box-shadow: inset 0 3px 6px rgba(0,0,0,0.07); position: relative; }
    .auth-tab { flex: 1; padding: 10px 6px; border: none; border-radius: 40px; background: transparent; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 0.95rem; color: #8a8078; cursor: pointer; transition: var(--transition); }
    .auth-tab.active { background: var(--ink); color: #fff; box-shadow: 0 4px 0 rgba(0,0,0,0.3); }
    .auth-tab:not(.active):hover { color: var(--ink); background: rgba(0,0,0,0.05); }
    .field { position: relative; margin-bottom: 12px; }
    .field .f-icon { position: absolute; right: 17px; top: 50%; transform: translateY(-50%); font-size: 1rem; opacity: 0.5; pointer-events: none; transition: var(--transition); z-index: 2; }
    .field input { width: 100%; padding: 15px 48px 15px 46px; border: 2px solid var(--ink); border-radius: 18px; font-size: 1rem; font-weight: 600; font-family: 'Cairo', sans-serif; background: #f9f6f0; color: var(--ink); text-align: right; transition: var(--transition); }
    .field input::placeholder { color: #a89e94; font-weight: 600; }
    .field input:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px rgba(230,71,60,0.13); transform: translateY(-2px); }
    .field:focus-within .f-icon { opacity: 1; transform: translateY(-50%) scale(1.15); }
    .field .f-toggle { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1rem; padding: 6px 8px; border-radius: 50%; line-height: 1; opacity: 0.55; transition: var(--transition); z-index: 2; }
    .field .f-toggle:hover { opacity: 1; background: rgba(0,0,0,0.06); }
    .btn-auth { position: relative; width: 100%; padding: 16px; border: 2px solid var(--ink); border-radius: 60px; background: linear-gradient(145deg, var(--primary-light), var(--primary)); font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 1.25rem; color: #fff; box-shadow: 0 7px 0 var(--primary-dark); cursor: pointer; transition: var(--transition); margin-top: 8px; overflow: hidden; letter-spacing: 0.3px; }
    .btn-auth.green-btn { background: linear-gradient(145deg, #5cc48f, var(--green)); box-shadow: 0 7px 0 var(--green-dark); }
    .btn-auth::after { content: ''; position: absolute; top: 0; left: -130%; width: 55%; height: 100%; background: linear-gradient(100deg, transparent, rgba(255,255,255,0.5), transparent); transform: skewX(-20deg); animation: shine 3.5s ease-in-out infinite; }
    @keyframes shine { 0%, 55% { left: -130%; } 100% { left: 140%; } }
    .btn-auth:hover { transform: translateY(-2px); }
    .btn-auth:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--primary-dark); }
    .btn-auth.green-btn:active { box-shadow: 0 2px 0 var(--green-dark); }
    .auth-error, .auth-success { display: flex; align-items: center; gap: 8px; border-radius: 16px; padding: 11px 14px; font-weight: 700; margin-bottom: 12px; font-size: 0.88rem; text-align: right; }
    .auth-error { background: #FFEAEA; border: 2px solid var(--primary); color: var(--primary-dark); animation: shake 0.4s ease; }
    .auth-success { background: #EAF6EF; border: 2px solid var(--green); color: var(--green-dark); animation: fadeInUp 0.3s ease; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    .auth-foot { margin-top: 16px; font-size: 0.78rem; font-weight: 700; color: #9a9088; display: flex; align-items: center; justify-content: center; gap: 6px; }

    .store-card { background: #fff; border-radius: var(--radius); padding: 36px 24px 30px; box-shadow: var(--shadow), 0 0 0 2px var(--ink), 0 8px 0 var(--ink); text-align: center; margin-bottom: 20px; position: relative; overflow: hidden; }
    .store-card.reveal { animation: revealBox 0.55s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes revealBox { 0% { opacity: 0; transform: scale(0.85) translateY(30px); } 60% { opacity: 1; transform: scale(1.02) translateY(-5px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
    .store-card .game-icon { font-size: 5.5rem; display: block; margin-bottom: 6px; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .store-card h2 { font-family: 'Baloo 2', sans-serif; font-size: 2.8rem; margin: 0; }
    .store-card .desc { font-weight: 700; color: #555; margin: 8px 0 12px; font-size: 1.1rem; }
    .store-card .stats { display: flex; justify-content: center; gap: 20px; margin: 16px 0 20px; font-size: 0.85rem; color: #777; }
    .store-card .stats span { background: var(--bg-gradient); padding: 4px 14px; border-radius: 50px; border: 2px solid var(--ink); font-weight: 700; box-shadow: 0 3px 0 var(--ink); }
    .btn-play { font-size: 2rem; padding: 16px 40px; display: inline-block; background: var(--green); color: #fff; border: 2px solid var(--ink); box-shadow: 0 8px 0 var(--green-dark); border-radius: 60px; cursor: pointer; font-family: 'Baloo 2', sans-serif; font-weight: 700; transition: var(--transition); }
    .btn-play:hover { transform: translateY(-2px); box-shadow: 0 10px 0 var(--green-dark); }
    .btn-play:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--green-dark); }
    .btn-play.mafia-btn { background: var(--mafia); box-shadow: 0 8px 0 var(--mafia-dark); }
    .btn-play.mafia-btn:hover { box-shadow: 0 10px 0 var(--mafia-dark); }
    .btn-play.mafia-btn:active { box-shadow: 0 2px 0 var(--mafia-dark); }
    .clickable-hero { cursor: pointer; transition: var(--transition); user-select: none; }
    .clickable-hero:hover { transform: translateY(-3px); box-shadow: 0 12px 0 var(--ink) !important; }
    .clickable-hero:active { transform: translateY(2px); box-shadow: 0 4px 0 var(--ink) !important; }
    .hero-hint { display: inline-block; margin-top: 14px; background: rgba(255,255,255,0.25); border: 2px dashed rgba(255,255,255,0.6); border-radius: 30px; padding: 6px 18px; font-size: 0.85rem; font-weight: 700; color: #fff; animation: hintPulse 2s ease-in-out infinite; transition: var(--transition); }
    @keyframes hintPulse { 0%, 100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.05); opacity: 1; } }
    .auth-hero { background: var(--primary); border: 2px solid var(--ink); border-radius: 24px; padding: 24px 20px; text-align: center; box-shadow: 0 8px 0 var(--ink); margin-bottom: 20px; position: relative; overflow: hidden; color: #fff; animation: fadeInUp 0.4s ease; }
    .auth-hero::before { content: "📺 ✨ 🍿"; position: absolute; top: -12px; right: -8px; font-size: 3.8rem; opacity: 0.2; }
    .auth-hero.mafia-hero { background: var(--mafia); }
    .auth-hero.mafia-hero::before { content: "🕵️ 🌙 🔪"; }
    h1.logo { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 2.8rem; margin: 0; text-shadow: 4px 4px 0 rgba(0,0,0,0.15); color: #fff; }
    h1.logo span { color: var(--yellow); }
    h1.logo .mafia-span { color: #E8B4F0; }
    .tagline { font-weight: 700; color: #fff; font-size: 1rem; margin: 4px 0 0; opacity: 0.9; }
    .welcome-banner { text-align: center; font-weight: 700; font-size: 1.1rem; margin-bottom: 16px; background: #fff; border: 2px solid var(--ink); border-radius: 50px; padding: 10px 16px; box-shadow: 0 4px 0 var(--ink); animation: fadeInUp 0.4s ease; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; animation: fadeInUp 0.5s ease; }
    .menu-box-btn { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 1.05rem; padding: 16px 10px; border: 2px solid var(--ink); border-radius: 18px; cursor: pointer; background: #fff; color: var(--ink); box-shadow: 0 6px 0 var(--ink); transition: var(--transition); display: flex; align-items: center; justify-content: center; gap: 6px; position: relative; overflow: hidden; }
    .menu-box-btn::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle, rgba(255,255,255,0.4) 10%, transparent 70%); opacity: 0; transition: opacity 0.3s; }
    .menu-box-btn:hover::before { opacity: 1; }
    .menu-box-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
    .menu-box-btn.red { background: var(--primary); color: #fff; box-shadow: 0 6px 0 var(--primary-dark); }
    .menu-box-btn.red:active { box-shadow: 0 2px 0 var(--primary-dark); }
    .menu-box-btn.blue { background: var(--blue); color: #fff; box-shadow: 0 6px 0 var(--blue-dark); }
    .menu-box-btn.blue:active { box-shadow: 0 2px 0 var(--blue-dark); }
    .panel { background: #fff; border: 2px solid var(--ink); border-radius: 24px; box-shadow: 0 8px 0 var(--ink); padding: 22px 18px; margin-bottom: 18px; animation: fadeInUp 0.5s ease; }
    .panel.center { text-align: center; }
    label { display: block; font-weight: 700; margin-bottom: 6px; font-size: 0.95rem; text-align: right; }
    input[type="text"], input[type="password"], textarea, select { width: 100%; font-family: 'Cairo', sans-serif; font-size: 1rem; padding: 14px 16px; border: 2px solid var(--ink); border-radius: 16px; margin-bottom: 14px; background: #f9f6f0; transition: var(--transition); }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px rgba(230,71,60,0.15); }
    textarea { resize: vertical; min-height: 80px; }
    .btn { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 1.2rem; padding: 14px 22px; border: 2px solid var(--ink); border-radius: 60px; cursor: pointer; background: var(--primary); color: #fff; box-shadow: 0 6px 0 var(--primary-dark); transition: var(--transition); width: 100%; text-align: center; position: relative; overflow: hidden; }
    .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--primary-dark); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
    .btn.green { background: var(--green); box-shadow: 0 6px 0 var(--green-dark); }
    .btn.green:active { box-shadow: 0 2px 0 var(--green-dark); }
    .btn.blue { background: var(--blue); box-shadow: 0 6px 0 var(--blue-dark); }
    .btn.blue:active { box-shadow: 0 2px 0 var(--blue-dark); }
    .btn.yellow { background: var(--yellow); color: var(--ink); box-shadow: 0 6px 0 var(--yellow-dark); }
    .btn.yellow:active { box-shadow: 0 2px 0 var(--yellow-dark); }
    .btn.red { background: var(--primary); box-shadow: 0 6px 0 var(--primary-dark); }
    .btn.mafia { background: var(--mafia); box-shadow: 0 6px 0 var(--mafia-dark); }
    .btn.mafia:active { box-shadow: 0 2px 0 var(--mafia-dark); }
    .btn.small { width: auto; font-size: 0.9rem; padding: 8px 18px; border-radius: 40px; box-shadow: 0 4px 0 var(--ink); }
    .btn.small:active { box-shadow: 0 1px 0 var(--ink); }
    .btn.undo { background: #9b59b6; color: #fff; box-shadow: 0 4px 0 #6c3483; font-size: 0.8rem; padding: 6px 12px; }
    .btn.undo:active { box-shadow: 0 1px 0 #6c3483; }
    .btn.cancel-btn { background: #8a8078; box-shadow: 0 6px 0 #5a524a; }
    .btn.cancel-btn:active { box-shadow: 0 2px 0 #5a524a; }
    .btn.disabled-lock { background: #ccc; color: #666; box-shadow: 0 6px 0 #999; cursor: not-allowed; }
    .btn.disabled-lock:active { transform: none; box-shadow: 0 6px 0 #999; }
    .code-badge { display: inline-flex; align-items: center; gap: 8px; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 1.8rem; letter-spacing: 5px; background: var(--blue); color: #fff; border: 2px solid var(--ink); border-radius: 16px; padding: 6px 20px; box-shadow: 0 6px 0 var(--ink); margin: 8px 0; }
    .code-badge .copy-icon { font-size: 1rem; cursor: pointer; padding: 4px 8px; border-radius: 8px; background: rgba(255,255,255,0.25); transition: var(--transition); letter-spacing: normal; }
    .code-badge .copy-icon:hover { background: rgba(255,255,255,0.4); }
    .code-badge .copy-icon:active { transform: scale(0.9); }
    .code-badge .copy-icon.copied { background: var(--green); color: #fff; }
    .players { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; justify-content: center; }
    .chip { background: #f9f6f0; border: 2px solid var(--ink); border-radius: 30px; padding: 5px 16px; font-weight: 700; font-size: 0.9rem; box-shadow: 0 3px 0 var(--ink); transition: var(--transition); animation: popIn 0.35s ease; }
    .chip.me { background: var(--yellow); }
    .chip.owner { border-color: #FFD700; background: #FFD70022; border-style: dashed; }
    .waiting-notice { background: #FFF4E0; border: 2px dashed var(--yellow-dark); border-radius: 18px; padding: 16px; margin: 14px 0; text-align: center; animation: fadeInUp 0.4s ease; }
    .waiting-notice .icon { font-size: 2.5rem; display: block; margin-bottom: 8px; animation: float 2.5s ease-in-out infinite; }
    .waiting-notice .title { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 1.15rem; color: var(--yellow-dark); margin-bottom: 4px; }
    .waiting-notice .text { font-weight: 700; font-size: 0.9rem; color: #666; line-height: 1.6; }
    .player-progress { display: flex; justify-content: center; gap: 8px; margin: 14px 0; }
    .progress-dot { width: 14px; height: 14px; border-radius: 50%; background: #e0e0e0; border: 2px solid var(--ink); transition: var(--transition); }
    .progress-dot.filled { background: var(--green); box-shadow: 0 0 0 3px rgba(76,175,125,0.3); }
    .divider { border: none; border-top: 2px dashed var(--ink); margin: 16px 0; opacity: 0.4; }
    .game-img-wrap { border: 2px solid var(--ink); border-radius: 18px; overflow: hidden; margin-bottom: 16px; background: #eee; box-shadow: 0 4px 0 var(--ink); animation: zoomIn 0.45s ease; }
    .game-img-wrap img { width: 100%; display: block; }
    .file-drop { border: 2px dashed var(--ink); border-radius: 18px; padding: 18px 14px; text-align: center; font-weight: 700; cursor: pointer; background: #f9f6f0; margin-bottom: 14px; box-shadow: 0 4px 0 var(--ink); transition: var(--transition); }
    .file-drop:hover { background: #efe8db; }
    .file-drop.has-img { padding: 0; border-style: solid; overflow: hidden; }
    .file-drop.has-img img { width: 100%; display: block; max-height: 220px; object-fit: cover; }
    .guess-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #f9f6f0; border: 2px solid var(--ink); border-radius: 16px; padding: 10px 16px; margin-bottom: 8px; box-shadow: 0 3px 0 var(--ink); animation: slideInRight 0.35s ease; }
    .guess-text { font-weight: 700; }
    .guess-text.wrong { text-decoration: line-through; opacity: 0.5; }
    .guess-text.correct { color: var(--green); }
    .verdict-btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .badge-tag { font-size: 0.7rem; font-weight: 700; padding: 3px 12px; border-radius: 30px; background: #eee; border: 1.5px solid var(--ink); box-shadow: 0 2px 0 var(--ink); }
    .waiting-msg { text-align: center; font-weight: 700; color: #666; padding: 18px 0; }
    .waiting-msg .spinner { display: inline-block; width: 16px; height: 16px; border: 3px solid #ddd; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-left: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .cartoon-picks { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .cartoon-chip { border: 2px solid var(--ink); border-radius: 30px; padding: 6px 16px; font-weight: 700; font-size: 0.85rem; cursor: pointer; background: #fff; box-shadow: 0 4px 0 var(--ink); transition: var(--transition); }
    .cartoon-chip:hover { transform: translateY(-2px); }
    .cartoon-chip:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
    .cartoon-chip.selected { background: var(--yellow); }
    .desc-card { background: #EAF6EF; border: 2px solid var(--green); border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; white-space: pre-wrap; font-size: 0.9rem; line-height: 1.7; box-shadow: 0 4px 0 var(--ink); text-align: right; }
    .top-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }

<div class="toast-container" id="toastContainer"></div>
<div class="celebration" id="celebrationContainer"></div>

<script>
// ===================================================================
// ===== الثوابت =====
// ===================================================================
const SALT = 'MySecretSalt2026!@#';
const STORAGE_PREFIX = 'cartoon-room:';
const CUSTOM_CARTOONS_KEY = 'cartoon-custom-list';
const USERS_DB_KEY = 'games-users-db';
const CURRENT_USER_KEY = 'games-current-user';
const SOUND_KEY = 'cartoon-sound-enabled';
const LAST_ROOM_CODE_KEY = 'cartoon-last-room-code';
const DRAFT_CUSTOM_KEY = 'cartoon-draft-custom';
const THEME_KEY = 'cartoon-theme';
const NOTIF_KEY = 'cartoon-notifications-enabled';

// ===================================================================
// ===== التخزين =====
// ===================================================================
function _encrypt(text) {
    if (!text) return text;
    try { return btoa(encodeURIComponent(SALT + '||' + text)); } catch (e) { return text; }
}
function _decrypt(text) {
    if (!text) return text;
    try {
        const decoded = decodeURIComponent(atob(text));
        if (decoded.startsWith(SALT + '||')) return decoded.slice(SALT.length + 2);
        return null;
    } catch (e) { return null; }
}
const storage = (() => {
    const cache = new Map();
    return {
        getItem(key, enc = false) {
            try {
                let val = localStorage.getItem(key);
                if (val === null) val = cache.get(key) || null;
                return enc ? _decrypt(val) : val;
            } catch (e) { return cache.get(key) || null; }
        },
        setItem(key, value, enc = false) {
            try {
                const final = enc ? _encrypt(value) : value;
                localStorage.setItem(key, final);
                cache.set(key, value);
                return true;
            } catch (e) { cache.set(key, value); return false; }
        },
        removeItem(key) {
            try { localStorage.removeItem(key); cache.delete(key); return true; }
            catch (e) { cache.delete(key); return false; }
        }
    };
})();

// ===================================================================
// ===== أدوات الأمان =====
// ===================================================================
function esc(str) {
    if (str === null || str === undefined) return '';
    return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escAttr(str) { return esc(str); }

function genSalt() {
    const arr = new Uint8Array(16);
    crypto.getRandomValues(arr);
    return Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
}
function cryptoAvailable() {
    return typeof crypto !== 'undefined' && crypto.subtle && typeof crypto.subtle.digest === 'function';
}
async function hashPassword(password, salt) {
    if (!cryptoAvailable()) throw new Error('crypto.subtle unavailable');
    const enc = new TextEncoder();
    const data = enc.encode(salt + '::' + password);
    const hash = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// ===================================================================
// ===== قاعدة بيانات المستخدمين =====
// ===================================================================
function loadUsersDB() {
    try { const raw = storage.getItem(USERS_DB_KEY, true); return raw ? JSON.parse(raw) : {}; }
    catch (e) { return {}; }
}
function saveUsersDB(db) {
    const ok = storage.setItem(USERS_DB_KEY, JSON.stringify(db), true);
    if (!ok) showToast('⚠️ فشل حفظ بيانات المستخدمين! تحقق من مساحة التخزين', 'error');
    return ok;
}
function loadCustomCartoons() {
    try { const raw = storage.getItem(CUSTOM_CARTOONS_KEY, true); return raw ? JSON.parse(raw) : []; }
    catch (e) { return []; }
}
function saveCustomCartoons(list) {
    const ok = storage.setItem(CUSTOM_CARTOONS_KEY, JSON.stringify(list), true);
    if (!ok) showToast('⚠️ فشل حفظ قائمة الكراتين', 'error');
    return ok;
}
function addCustomCartoon(data) {
    const list = loadCustomCartoons();
    if (list.some(c => c.name.toLowerCase() === data.name.toLowerCase())) return false;
    if (CARTOON_PRESETS.some(c => c.name.toLowerCase() === data.name.toLowerCase())) return false;
    list.push(data);
    return saveCustomCartoons(list);
}
function getAllCartoons() { return [...CARTOON_PRESETS, ...loadCustomCartoons()]; }

// ===================================================================
// ===== BroadcastChannel =====
// ===================================================================
let channel = null;
function initBroadcast() {
    try {
        channel = new BroadcastChannel('cartoon-channel');
        channel.onmessage = (e) => {
            if (e.data && e.data.type === 'room-update' && e.data.roomCode === roomCode) pollRoom();
        };
    } catch (e) {}
}

// ===================================================================
// ===== حالة الغرفة =====
// ===================================================================
function saveRoomState(code, data) {
    if (!code || !data) return false;
    try {
        const clean = {
            code: data.code, status: data.status, maxPlayers: data.maxPlayers,
            uploader: data.uploader ? { id: data.uploader.id, name: data.uploader.name } : null,
            players: data.players.map(p => ({ id: p.id, name: p.name })),
            cartoonName: data.cartoonName || '', imageUrl: data.imageUrl || '',
            description: data.description || '',
            guesses: (data.guesses || []).map(g => ({ playerId: g.playerId, playerName: g.playerName, text: g.text, status: g.status || 'pending' })),
            scores: data.scores || {}, round: data.round || 1, winner: data.winner || null,
            timestamp: Date.now()
        };
        const ok = storage.setItem(STORAGE_PREFIX + code, JSON.stringify(clean), true);
        if (!ok) return false;
        if (channel) channel.postMessage({ type: 'room-update', roomCode: code });
        return true;
    } catch (e) { return false; }
}
function persistRoom() {
    if (!roomCode || !state) return false;
    const ok = saveRoomState(roomCode, state);
    if (!ok) showToast('⚠️ فشل حفظ البيانات! تحقق من مساحة التخزين', 'error');
    return ok;
}
function loadRoomState(code) {
    if (!code) return null;
    try {
        const raw = storage.getItem(STORAGE_PREFIX + code, true);
        if (!raw) return null;
        const s = JSON.parse(raw);
        return (s && s.code === code) ? s : null;
    } catch (e) { return null; }
}
function deleteRoomState(code) {
    if (!code) return false;
    try {
        storage.removeItem(STORAGE_PREFIX + code);
        if (channel) channel.postMessage({ type: 'room-update', roomCode: code });
        return true;
    } catch (e) { return false; }
}
function cleanExpiredRooms(maxAge = 60 * 60 * 1000) {
    try {
        const toDelete = [];
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && key.startsWith(STORAGE_PREFIX)) {
                const raw = storage.getItem(key, true);
                if (raw) {
                    try {
                        const s = JSON.parse(raw);
                        if (s.timestamp && (Date.now() - s.timestamp) > maxAge) toDelete.push(key);
                    } catch (e) { toDelete.push(key); }
                }
            }
        }
        toDelete.forEach(k => storage.removeItem(k));
        return toDelete.length;
    } catch (e) { return 0; }
}
function _stateKey(s) {
    if (!s) return '';
    const { timestamp, ...rest } = s;
    return JSON.stringify(rest);
}

// ===================================================================
// ===== البيانات =====
// ===================================================================
function fmtDesc(f) {
    const lines = [];
    if (f.channel) lines.push('القناة: ' + f.channel);
    if (f.planet) lines.push('الكوكب: ' + f.planet);
    if (f.count) lines.push('عدد الشخصيات الرئيسية: ' + f.count);
    if (f.category) lines.push('التصنيف: ' + f.category);
    if (f.characters) lines.push('الشخصيات:\n' + f.characters);
    if (f.story) lines.push('القصة:\n' + f.story);
    return lines.join('\n');
}

const CARTOON_PRESETS = [
    { name: 'المحقق كونان', description: fmtDesc({ channel: 'سبيستون', planet: 'كوكب أكشن', count: '4', category: 'أنمي غموض وتحقيق', characters: '• كونان إيدوجاوا: المتحري الذكي.\n• ران موري: صديقة سينشي المخلصة.\n• توغو موري: المحقق الخاص الفكاهي.\n• الدكتور أغاسا: المخترع الجار.', story: 'طالب الثانوية سينشي كودو يتحول إلى طفل صغير بعد تناوله عقاراً ساماً، فيحاول حل القضايا للوصول إلى المنظمة السوداء.' }) },
    { name: 'أبطال الديجيتال', description: fmtDesc({ channel: 'سبيستون', planet: 'كوكب مغامرات', count: '4', category: 'أنمي خيال علمي ومغامرات', characters: '• أمجد: قائد أبطال الديجيتال وصاحب الشجاعة.\n• يامن: الصديق المخلص والمنافس.\n• أبطال العالم الرقمي وووحوشهم.', story: 'مجموعة من الأطفال ينتقلون إلى العالم الرقمي ليصبحوا أبطالاً يدافعون عنه رفقة مرافقيهم.' }) },
    { name: 'أبطال التايتنز', description: fmtDesc({ channel: 'Cartoon Network (CN)', count: '5', category: 'أكشن وكوميديا', characters: '• روبن: القائد الجاد والمنظم.\n• ستارفلاير: الفتاة الفضائية اللطيفة.\n• سايبرغ: النصف آلي المحب للمرح.\n• بيست بوي: الفتى القادر على التحول للحيوانات.\n• رايفن: الفتاة الغامضة ذات القوى السحرية.', story: 'فريق من الأبطال الخارقين الشباب يدافعون عن مدينتهم وخوضون مواقف كوميدية يومية.' }) },

function compressImage(dataUrl, maxWidth = 500) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
            try {
                const canvas = document.createElement('canvas');
                const ratio = Math.min(maxWidth / img.width, 1);
                canvas.width = img.width * ratio;
                canvas.height = img.height * ratio;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                resolve(canvas.toDataURL('image/jpeg', 0.75));
            } catch (e) { reject(e); }
        };
        img.onerror = () => reject(new Error('image load failed'));
        img.src = dataUrl;
    });
}

function _getAudioCtx() {
    try {
        if (!_audioCtx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return null;
            _audioCtx = new Ctx();
        }
        if (_audioCtx.state === 'suspended') _audioCtx.resume().catch(() => {});
        return _audioCtx;
    } catch (e) { return null; }
}

function _playTone(freq, duration, type, volume, delay, sweepTo) {
    const ctx = _getAudioCtx();
    if (!ctx) return;
    try {
        const t0 = ctx.currentTime + (delay || 0);
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, t0);
        if (sweepTo) osc.frequency.exponentialRampToValueAtTime(sweepTo, t0 + duration);
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(volume || 0.12, t0 + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t0);
        osc.stop(t0 + duration + 0.05);
    } catch (e) {}
}

function playSound(type) {
    if (!soundEnabled) return;
    const notes = SOUND_LIBRARY[type];
    if (!notes) return;
    notes.forEach(n => _playTone(n.f, n.d, n.t, n.v, n.at || 0, n.sweep));
}

let notifEnabled = false;

function updateNotifButton() {
    const btn = document.getElementById('notifToggleBtn');
    if (!btn) return;
    if (!('Notification' in window)) { btn.style.display = 'none'; return; }
    btn.style.display = '';
    const perm = Notification.permission;
    if (perm === 'denied') {
        btn.textContent = '🔕'; btn.title = 'الإشعارات محظورة من المتصفح'; btn.style.opacity = '0.5';
    } else if (notifEnabled && perm === 'granted') {
        btn.textContent = '🔔'; btn.title = 'الإشعارات مفعلة'; btn.style.opacity = '1';
    } else {
        btn.textContent = '🔕'; btn.title = 'الإشعارات متوقفة — اضغط للتفعيل'; btn.style.opacity = '1';
    }
}

function toggleNotifications() {
    playSound('toggle');
    if (!('Notification' in window)) {
        showToast('متصفحك لا يدعم الإشعارات', 'error'); return;
    }
    if (Notification.permission === 'denied') {
        showAlert('الإشعارات محظورة من إعدادات المتصفح.\n\nلتفعيلها:\n• Chrome: أيقونة القفل → الإشعارات → السماح\n• Safari: الإعدادات → المواقع → الإشعارات', '🔕 الإشعارات محظورة');
        return;
    }
    if (!notifEnabled) {
        const enable = () => {
            notifEnabled = true;
            storage.setItem(NOTIF_KEY, 'true');
            updateNotifButton();
            playSound('notify');
            showToast('🔔 تم تفعيل الإشعارات', 'success');
            showNotification('الإشعارات مفعلة ✅', 'ستصلك تنبيهات عند دورك في اللعبة');
        };
        if (Notification.permission === 'granted') { enable(); }
        else {
            Notification.requestPermission().then(perm => {
                if (perm === 'granted') enable();
                else showToast('لم يتم منح إذن الإشعارات', 'error');
                updateNotifButton();
            }).catch(() => showToast('تعذّر طلب إذن الإشعارات', 'error'));
        }
    } else {
        notifEnabled = false;
        storage.setItem(NOTIF_KEY, 'false');
        updateNotifButton();
        showToast('🔕 تم إيقاف الإشعارات', 'info');
    }
}

function showNotification(title, body) {
    if (!notifEnabled) return;
    if (!('Notification' in window)) return;
    if (Notification.permission !== 'granted') return;
    if (!document.hidden) return;
    try {
        const n = new Notification(title, {
            body: body, tag: 'cartoon-game', silent: true, renotify: false
        });
        setTimeout(() => { try { n.close(); } catch (e) {} }, 6000);
        n.onclick = () => { try { window.focus(); n.close(); } catch (e) {} };
    } catch (e) {}
}

function showToast(message, type = 'info') {
    const container = document.getElementById('toastContainer');
    if (!container) return;
    const toast = document.createElement('div');
    toast.className = 'toast ' + type;
    const icons = { success: '✅', error: '⚠️', info: 'ℹ️' };
    const iconSpan = document.createElement('span');
    iconSpan.textContent = icons[type] || '💬';
    const msgSpan = document.createElement('span');
    msgSpan.textContent = String(message);
    toast.appendChild(iconSpan); toast.appendChild(msgSpan);
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

function showAlert(message, title = 'تنبيه') {
    playSound('modalOpen');
    const container = document.getElementById('modalContainer');
    if (!container) return;
    container.innerHTML = '';
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const box = document.createElement('div');
    box.className = 'modal-box';
    const h3 = document.createElement('h3');
    h3.textContent = String(title);
    const p = document.createElement('p');
    p.textContent = String(message);
    const btn = document.createElement('button');
    btn.className = 'btn green'; btn.textContent = 'حسناً';
    btn.addEventListener('click', closeModal);
    overlay.addEventListener('click', closeModal);
    box.addEventListener('click', (e) => e.stopPropagation());
    box.appendChild(h3); box.appendChild(p); box.appendChild(btn);
    overlay.appendChild(box);
    container.appendChild(overlay);
}

function closeModal() {
    playSound('modalClose');
    document.getElementById('modalContainer').innerHTML = '';
}

function showConfirm(message, title = 'تأكيد') {
    return new Promise((resolve) => {
        playSound('modalOpen');
        const container = document.getElementById('modalContainer');
        if (!container) { resolve(false); return; }

        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';

        const box = document.createElement('div');
        box.className = 'modal-box';

        const h3 = document.createElement('h3');
        h3.textContent = String(title);

        const p = document.createElement('p');
        p.textContent = String(message);

        const btns = document.createElement('div');
        btns.style.cssText = 'display:flex; gap:10px; margin-top:8px;';

        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'btn cancel-btn';
        cancelBtn.style.cssText = 'flex:1; font-size:1rem;';
        cancelBtn.textContent = 'إلغاء';

        const okBtn = document.createElement('button');
        okBtn.className = 'btn green';
        okBtn.style.cssText = 'flex:1; font-size:1rem;';
        okBtn.textContent = 'تأكيد';

        const close = (result) => {
            playSound('modalClose');
            container.innerHTML = '';
            resolve(result);
        };

        cancelBtn.addEventListener('click', () => close(false));
        okBtn.addEventListener('click', () => close(true));
        overlay.addEventListener('click', () => close(false));
        box.addEventListener('click', (e) => e.stopPropagation());

        btns.appendChild(cancelBtn);
        btns.appendChild(okBtn);
        box.appendChild(h3);
        box.appendChild(p);
        box.appendChild(btns);
        overlay.appendChild(box);
        container.innerHTML = '';
        container.appendChild(overlay);

        setTimeout(() => okBtn.focus(), 50);
    });
}

async function handleLogin(e) {
    e.preventDefault();
    playSound('click');
    authError = ''; authErrorField = ''; authSuccess = '';
    const username = document.getElementById('authUsername')?.value.trim();
    const password = document.getElementById('authPassword')?.value;
    authUsernameVal = username || '';
    if (!username || !password) {
        authError = 'يرجى ملء جميع الحقول.';
        authErrorField = !username ? 'username' : 'password';
        renderApp(); return;
    }
    if (!cryptoAvailable()) {
        authError = 'متصفحك لا يدعم التشفير الآمن. جرّب HTTPS أو متصفحاً حديثاً.';
        authErrorField = 'username';
        renderApp(); return;
    }
    const users = loadUsersDB();
    if (!users[username]) {
        authError = 'لا يوجد حساب بهذا الاسم. أنشئ حساباً جديداً.';
        authErrorField = 'username';
        renderApp(); return;
    }
    const user = users[username];
    let ok = false;
    try {
        if (user.passwordHash && user.salt) {
            const h = await hashPassword(password, user.salt);
            ok = (h === user.passwordHash);
        } else if (user.password) {
            if (user.password === password) {
                ok = true;
                const salt = genSalt();
                user.salt = salt;
                user.passwordHash = await hashPassword(password, salt);
                delete user.password;
                users[username] = user;
                if (!saveUsersDB(users)) {
                    console.warn('Migration save failed');
                    showToast('⚠️ تعذّر ترحيل بيانات حسابك. سيُعاد المحاولة لاحقاً', 'info');
                }
            }
        }
    } catch (err) {
        authError = 'حدث خطأ أثناء التحقق. حاول مرة أخرى.';
        authErrorField = 'password';
        renderApp(); return;
    }
    if (!ok) {

async function handleRegister(e) {
    e.preventDefault();
    playSound('click');
    authError = ''; authErrorField = ''; authSuccess = '';
    const username = document.getElementById('authUsername')?.value.trim();
    const password = document.getElementById('authPassword')?.value;
    const confirm = document.getElementById('authConfirm')?.value;
    authUsernameVal = username || '';
    if (!username || !password || !confirm) {
        authError = 'يرجى ملء جميع الحقول.';
        authErrorField = !username ? 'username' : (!password ? 'password' : 'confirm');
        renderApp(); return;
    }
    if (username.length < 2) { authError = 'اسم المستخدم يجب أن يكون حرفين على الأقل.'; authErrorField = 'username'; renderApp(); return; }
    if (password.length < 4) { authError = 'كلمة المرور يجب أن تكون 4 أحرف على الأقل.'; authErrorField = 'password'; renderApp(); return; }
    if (password !== confirm) { authError = 'كلمتا المرور غير متطابقتين.'; authErrorField = 'confirm'; renderApp(); return; }
    if (!cryptoAvailable()) { authError = 'متصفحك لا يدعم التشفير الآمن. جرّب HTTPS أو متصفحاً حديثاً.'; authErrorField = 'username'; renderApp(); return; }
    const users = loadUsersDB();
    if (users[username]) { authError = 'اسم المستخدم مستخدم بالفعل. اختر اسماً آخر.'; authErrorField = 'username'; renderApp(); return; }
    let salt, passwordHash;
    try {
        salt = genSalt();
        passwordHash = await hashPassword(password, salt);
    } catch (err) {
        authError = 'حدث خطأ أثناء تشفير كلمة المرور.';
        authErrorField = 'password'; renderApp(); return;
    }
    const newUser = {
        id: 'u_' + Math.random().toString(36).substr(2, 9),
        username: username, passwordHash: passwordHash, salt: salt, createdAt: Date.now()
    };
    users[username] = newUser;
    if (!saveUsersDB(users)) { authError = 'فشل حفظ الحساب. تحقق من مساحة التخزين.'; authErrorField = 'username'; renderApp(); return; }
    currentUser = { username: username, id: newUser.id };
    storage.setItem(CURRENT_USER_KEY, JSON.stringify(currentUser), true);
    me = { id: currentUser.id, name: currentUser.username };
    inGame = false; cartoonBoxVisible = false; mafiaBoxVisible = false;
    authSuccess = ''; authErrorField = ''; authUsernameVal = '';
    showToast(`تم إنشاء حسابك بنجاح! مرحباً ${username}`, 'success');
    renderApp();
}

function removeMeFromRoom() {
    if (!roomCode || !state || !me) return;
    try {
        state.players = state.players.filter(p => p.id !== me.id);
        state.guesses = (state.guesses || []).filter(g => g.playerId !== me.id);
        if (state.scores && Object.prototype.hasOwnProperty.call(state.scores, me.id)) delete state.scores[me.id];
        if (state.winner === me.id) state.winner = null;
        if (state.players.length === 0) {
            deleteRoomState(roomCode);
        } else {
            if (state.uploader && state.uploader.id === me.id) {
                if (state.status === 'playing' || state.status === 'setup') {
                    state.status = 'lobby';
                    state.cartoonName = ''; state.imageUrl = ''; state.description = '';
                    state.guesses = []; state.winner = null;
                }
                state.uploader = state.players[0];
            }
            saveRoomState(roomCode, state);
        }
    } catch (e) {}
}

let _cleanupDone = false;
function cleanupOnExit() {
    if (_cleanupDone) return;
    _cleanupDone = true;
    if (!roomCode || !state || !me || !state.players) return;
    try {
        const updated = JSON.parse(JSON.stringify(state));
        updated.players = updated.players.filter(p => p.id !== me.id);
        updated.guesses = (updated.guesses || []).filter(g => g.playerId !== me.id);
        if (updated.scores && updated.scores[me.id]) delete updated.scores[me.id];
        if (updated.winner === me.id) updated.winner = null;
        if (updated.players.length === 0) {
            storage.removeItem(STORAGE_PREFIX + roomCode);
        } else {
            if (updated.uploader && updated.uploader.id === me.id) {
                if (updated.status === 'playing' || updated.status === 'setup') {
                    updated.status = 'lobby';
                    updated.cartoonName = ''; updated.imageUrl = ''; updated.description = '';
                    updated.guesses = []; updated.winner = null;
                }
                updated.uploader = updated.players[0];
            }
            updated.timestamp = Date.now();
            storage.setItem(STORAGE_PREFIX + roomCode, JSON.stringify(updated), true);
        }
        if (channel) channel.postMessage({ type: 'room-update', roomCode: roomCode });
    } catch (e) {}
}

function pollRoom() {
    if (!roomCode) return;
    const loaded = loadRoomState(roomCode);
    const isUploaderBefore = state && state.uploader && state.uploader.id === me.id;
    if (!loaded) {
        showToast('تم إنهاء الغرفة', 'error');
        roomCode = null; state = null;
        lastWinnerId = null; lastSeenRound = 0;
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        renderApp();
        return;
    }
    try {
        if (_stateKey(state) !== _stateKey(loaded)) {
            const prevWinner = state ? state.winner : null;
            const prevPlayersCount = state ? state.players.length : 0;
            const prevRound = state ? state.round : null;
            const prevPlayerIds = state ? state.players.map(p => p.id) : [];

            const activeEl = document.activeElement;
            const focusId = activeEl && activeEl.id ? activeEl.id : null;
            const focusVal = activeEl && activeEl.tagName === 'INPUT' && activeEl.type === 'text'
                ? activeEl.value : null;
            let selStart = null, selEnd = null;
            if (activeEl && activeEl.tagName === 'INPUT' && typeof activeEl.selectionStart === 'number') {
                selStart = activeEl.selectionStart;
                selEnd = activeEl.selectionEnd;
            }

            state = loaded;
            if (state.round !== lastSeenRound) {
                lastSeenRound = state.round;
                resetDraft();
                lastWrongGuessText = '';
                currentGuessInputVal = '';
            }
            renderApp();

            if (state.winner && state.winner !== prevWinner && state.winner !== lastWinnerId) {
                lastWinnerId = state.winner;
                celebrate();
                const winnerName = state.players.find(p => p.id === state.winner)?.name || 'لاعب';
                showToast(`🏆 ${winnerName} فاز بالجولة!`, 'success');
            }
            if (state.players.length > prevPlayersCount && state.status === 'lobby') {
                const newPlayers = state.players.filter(p => !prevPlayerIds.includes(p.id));
                if (newPlayers.length > 0) {
                    playSound('join');
                    newPlayers.forEach(p => showToast(`👋 ${p.name} انضم إلى الغرفة`, 'info'));
                }
            }
            if (state.players.length < prevPlayersCount && state.status === 'lobby') {
                const leftCount = prevPlayersCount - state.players.length;
                if (leftCount > 0) {
                    playSound('leave');
                    showToast(`👋 غادر ${leftCount} لاعب الغرفة`, 'info');
                }
            }
            if (prevRound !== null && state.round > prevRound) {
                const isMyTurn = state.uploader && state.uploader.id === me.id;
                if (isMyTurn) {
                    playSound('yourTurn');
                    showToast(`🎨 الجولة ${state.round} — دورك ترفع كرتون!`, 'info');
                    showNotification('🎨 دورك الآن!', `الجولة ${state.round} — اختر كرتوناً ليخمّنه الآخرون`);
                } else {
                    playSound('roundStart');
                    showToast(`🎬 الجولة ${state.round} بدأت!`, 'info');
                    showNotification('🎬 جولة جديدة', `الجولة ${state.round} بدأت — استعد للتخمين!`);
                }
            }
            if (state.status === 'setup' &&
                state.uploader && state.uploader.id === me.id &&
                !isUploaderBefore) {
                playSound('yourTurn');
                showToast('🎨 دورك الآن لاختيار الكرتون!', 'info');
                showNotification('🎨 دورك الآن!', 'أنت المسؤول عن رفع الكرتون');
            }

            if (focusId) {
                setTimeout(() => {
                    const el = document.getElementById(focusId);
                    if (!el) return;
                    if (focusVal !== null && el.value === '' && focusVal !== '') el.value = focusVal;
                    el.focus();
                    if (selStart !== null && selEnd !== null) {
                        try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
                    }
                }, 0);
            }
        }
    } catch (e) {}
}

        }
        return Promise.resolve(false);
    };
    doCopy(roomCode).then((ok) => {
        if (ok) {
            playSound('copy');
            showToast('✅ تم نسخ كود الغرفة!', 'success');
            flashCopyIcon();
        } else {
            fallbackCopy(roomCode);
        }

function flashCopyIcon() {
    const icon = document.querySelector('.code-badge .copy-icon');

    icon.classList.add('copied');
    icon.textContent = '✓';
    setTimeout(() => {
        icon.classList.remove('copied');
        icon.textContent = '📋';

}
function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try {
        document.execCommand('copy');
        playSound('copy');
        showToast('✅ تم نسخ كود الغرفة!', 'success');
        flashCopyIcon();
    } catch (e) {
        showAlert(`انسخ الكود يدوياً:\n\n${text}`, '📋 كود الغرفة');
    }
    document.body.removeChild(ta);
}

        showToast('لديك تخمين معلق بالفعل!', 'error'); return;
    }

    if (myGuess && myGuess.status === 'wrong') lastWrongGuessText = myGuess.text;
    state.guesses = state.guesses.filter(g => g.playerId !== me.id);
    currentGuessInputVal = '';
    persistRoom();
    renderApp();
}

function undoVerdictGuess(playerId) {

    guess.status = 'pending';
    persistRoom();
    showToast('تم التراجع عن التصحيح', 'info');
    renderApp();
}

function verdictGuess(playerId, verdict) {
    if (!state || !state.guesses) return;
    const guess = state.guesses.find(g => g.playerId === playerId);
    if (!guess) return;
    if (guess.status !== 'pending') return;
    if (verdict === 'correct' && state.winner) {
        showToast('تم تحديد الفائز بالفعل في هذه الجولة!', 'error'); return;
    }
    if (verdict === 'correct') playSound('correct');
    else playSound('wrong');
    guess.status = verdict;
    if (verdict === 'correct') {
        state.guesses.forEach(g => {
            if (g.playerId !== playerId && g.status === 'pending') g.status = 'wrong';
        });
        state.scores[playerId] = (state.scores[playerId] || 0) + 1;
        state.winner = playerId; lastWinnerId = playerId;
        const winnerName = state.players.find(p => p.id === playerId)?.name || 'لاعب';
        showToast(`🏆 ${winnerName} فاز بالجولة!`, 'success');
        celebrate();
    }
    persistRoom();
    renderApp();
}

function nextRound() {
    playSound('click');
    if (!state) return;
    if (!state.uploader || state.uploader.id !== me.id) {
        showToast('فقط المنشئ يمكنه بدء الجولة التالية', 'error'); return;
    }
    if (!canStartGame()) {
        showAlert('يجب أن يكون هناك لاعبان على الأقل للاستمرار.', '⏳ بانتظار اللاعبين'); return;
    }
    if (state.uploader) {
        const idx = state.players.findIndex(p => p.id === state.uploader.id);
        const nextIdx = (idx >= 0) ? (idx + 1) % state.players.length : 0;
        state.uploader = state.players[nextIdx];
    }
    state.round = (state.round || 1) + 1;
    lastSeenRound = state.round;
    state.cartoonName = ''; state.imageUrl = ''; state.description = '';
    state.guesses = []; state.winner = null; state.status = 'setup';
    lastWinnerId = null; lastWrongGuessText = ''; currentGuessInputVal = '';
    resetDraft();
    if (!persistRoom()) return;
    showToast(`بدء الجولة ${state.round}`, 'info');
    renderApp();
}

function openProfile() {
    playSound('click');
    const inRoom = !!roomCode;
    const myScore = (state && state.scores && state.scores[me.id]) || 0;
    const msg = inRoom
        ? `اسم المستخدم: ${me.name}\nمعرف اللاعب: ${me.id.substring(0, 12)}\nنقاطك في الغرفة الحالية: ${myScore}`
        : `اسم المستخدم: ${me.name}\nمعرف اللاعب: ${me.id.substring(0, 12)}\n\nلست في أي غرفة حالياً.`;
    showAlert(msg, 'الملف الشخصي 👤');
}

function initEventDelegation() {
    const app = document.getElementById('app');
    if (!app || app._delegationAttached) return;
    app._delegationAttached = true;
    app.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        const action = btn.dataset.action;
        if (action === 'verdict') verdictGuess(btn.dataset.playerId, btn.dataset.verdict);
        else if (action === 'undo-verdict') undoVerdictGuess(btn.dataset.playerId);
        else if (action === 'select-channel') selectChannel(btn.dataset.channel);
    });
}

function initApp() {
    const savedSound = storage.getItem(SOUND_KEY);
    soundEnabled = savedSound === null ? true : (savedSound === 'true');
    updateSoundButton();

    const savedNotif = storage.getItem(NOTIF_KEY);
    notifEnabled = savedNotif === 'true';
    updateNotifButton();

    applyTheme();

    cleanExpiredRooms();
    initBroadcast();
    initEventDelegation();

    const savedUser = storage.getItem(CURRENT_USER_KEY, true);
    if (savedUser) {
        try {
            const parsed = JSON.parse(savedUser);
            const users = loadUsersDB();
            if (users[parsed.username] && users[parsed.username].id === parsed.id) {
                currentUser = parsed;
                me = { id: currentUser.id, name: currentUser.username };
            }
        } catch (e) {}
    }
    roomCodeInputVal = storage.getItem(LAST_ROOM_CODE_KEY) || '';
    inGame = false; cartoonBoxVisible = false; mafiaBoxVisible = false;
    authMode = 'login'; authError = ''; authErrorField = ''; authSuccess = '';
    lastWinnerId = null; lastSeenRound = 0;

    window.addEventListener('beforeunload', cleanupOnExit);
    window.addEventListener('pagehide', cleanupOnExit);

    renderApp();
}

function updateLogoutButton() {
    const btn = document.getElementById('logoutBtnTop');
    if (!btn) return;
    if (currentUser) btn.classList.add('visible');
    else btn.classList.remove('visible');
}

function cartoonMatchesChannel(c, ch) {
    if (!c || !c.description) return false;
    const firstLine = (c.description.split('\n')[0] || '').replace('القناة:', '').trim();
    if (!firstLine) return false;
    if (firstLine === ch) return true;
    if (firstLine.includes(ch)) return true;
    if (ch === 'قناة أجيال' && firstLine.includes('أجيال')) return true;
    return false;
}

                <div style="display:flex; gap:8px; margin-bottom:12px;">
                    <button class="btn blue small" style="flex:1; font-size:0.9rem;" onclick="toggleSetupMode('presets')">📺 القنوات</button>
                    <button class="btn small" style="flex:1; font-size:0.9rem; background:#333; box-shadow: 0 4px 0 #111;" onclick="toggleSetupMode('custom')">➕ كرتون من عندي</button>
                </div>
                ${setupMode === 'presets' ? `
                    <div style="margin-bottom:6px;"><label style="margin:0;">اختر القناة:</label></div>
                    <div class="cartoon-picks" style="margin-bottom:10px;">
                        ${channelsList.map(ch => `
                            <div class="cartoon-chip ${selectedChannel===ch?'selected':''}" data-action="select-channel" data-channel="${escAttr(ch)}">${esc(ch)}</div>
                        `).join('')}
                    </div>
                    ${selectedChannel ? `
                        <div style="font-weight:700; font-size:0.9rem; color:var(--blue); margin-bottom:6px; text-align:right;">كراتين قناة ${esc(selectedChannel)}:</div>
                        <div class="cartoon-picks" style="max-height:240px; overflow-y:auto; padding:4px;">
                            ${allCartoons.filter(c => cartoonMatchesChannel(c, selectedChannel)).map(c => `
                                <div class="cartoon-chip ${draftCartoonName===c.name?'selected':''}"
                                     onclick="selectPresetCartoon(this)"
                                     data-name="${escAttr(c.name)}">${esc(c.name)} ${customList.some(custom => custom.name===c.name)?'⭐':''}</div>
                            `).join('') || '<div class="waiting-msg" style="width:100%;">لا توجد كراتين لهذه القناة</div>'}
                        </div>
                    ` : `<div class="waiting-msg" style="padding: 10px 0;">👆 اختر قناة لعرض الكراتين</div>`}
                    <div class="divider"></div>
                ` : ''}
                ${setupMode === 'custom' ? `
                    <div class="custom-fields">
                        ${hasDraft ? `<div class="draft-hint"><span>📝</span><span>مسودة محفوظة — سيتم حفظ التغييرات تلقائياً</span></div>` : ''}
                        <label>اسم الكرتون (إلزامي) *</label>
                        <input type="text" id="customNameField" placeholder="مثال: سوبر مان" value="${escAttr(customNameInputVal)}" oninput="customNameInputVal=this.value; saveDraftCustom();" autocomplete="off">
                        <label>القناة</label>
                        <input type="text" id="customChannelField" placeholder="مثال: MBC3" value="${escAttr(customChannelInputVal)}" oninput="customChannelInputVal=this.value; saveDraftCustom();" autocomplete="off">
                        <label>الكوكب (إذا كان من سبيستون)</label>
                        <input type="text" id="customPlanetField" placeholder="مثال: كوكب أكشن" value="${escAttr(customPlanetInputVal)}" oninput="customPlanetInputVal=this.value; saveDraftCustom();" autocomplete="off">
                        <label>عدد الشخصيات الرئيسية</label>
                        <input type="text" id="customCountField" placeholder="مثال: 4" value="${escAttr(customCountInputVal)}" oninput="customCountInputVal=this.value; saveDraftCustom();" autocomplete="off">
                        <label>التصنيف</label>
                        <input type="text" id="customCategoryField" placeholder="مثال: أكشن ومغامرات" value="${escAttr(customCategoryInputVal)}" oninput="customCategoryInputVal=this.value; saveDraftCustom();" autocomplete="off">
                        <label>الشخصيات</label>
                        <textarea id="customCharactersField" rows="3" placeholder="• الشخصية الأولى&#10;• الشخصية الثانية" oninput="customCharactersInputVal=this.value; saveDraftCustom();">${esc(customCharactersInputVal)}</textarea>
                        <label>القصة</label>
                        <textarea id="customStoryField" rows="3" placeholder="ملخص قصة الكرتون..." oninput="customStoryInputVal=this.value; saveDraftCustom();">${esc(customStoryInputVal)}</textarea>
                        <div style="display:flex; gap:8px; margin-top:8px;">
                            <button class="btn green small" style="flex:1;" onclick="saveCustomCartoon()">💾 حفظ وإضافة</button>
                            <button class="btn red small" style="flex:1;" onclick="cancelCustomCartoon()">إلغاء ❌</button>
                        </div>
                    </div>
                ` : ''}
                ${draftCartoonName ? `
                    <label style="text-align:right;">صورة التحدي (اختياري)</label>
                    <div class="file-drop ${customImageData?'has-img':''}" onclick="document.getElementById('fileInput').click()">
                        ${customImageData ? `<img src="${escAttr(customImageData)}" alt="صورة">` : `<span>📷 اضغط لرفع صورة الكرتون (اختياري)</span>`}
                    </div>
                    <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
                ` : ''}
                ${draftDescription && setupMode !== 'custom' ? `<div class="desc-card">${esc(draftDescription)}</div>` : ''}
                <button class="btn green" style="margin-top:6px;" onclick="publishGame()">انشر السؤال 🚀</button>
                <button class="btn red small" style="margin-top:8px;" onclick="leaveRoom()">إلغاء وخروج</button>
            </div>
        `;
        return;
    }

    // ---- اللعب ----
    if (state.status === 'playing') {
        const myGuessObj = state.guesses ? state.guesses.find(g => g.playerId === me.id) : null;
        app.innerHTML = `
            <div class="top-header-row">
                <button class="menu-box-btn red" style="padding:6px 14px; font-size:0.85rem;" onclick="leaveRoom()">خروج 🚪</button>
                <h1 class="logo" style="font-size:2rem; margin:0;">🎨 خمّن <span>الكرتون</span></h1>
            </div>
            <div class="panel center" style="padding:14px; margin-bottom:14px;">
                <p style="font-weight:700; margin:0;">كود الغرفة</p>
                <div class="code-badge" style="font-size:1.4rem; padding:4px 14px;">
                    <span>${esc(roomCode)}</span>
                    <span class="copy-icon" onclick="copyRoomCode()" title="نسخ">📋</span>
                </div>
                <div style="display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:6px 0;">
                    <span class="badge-tag">الجولة ${state.round || 1}</span>
                </div>
                <div class="players">
                    ${state.players.map(p => `
                        <span class="chip ${p.id===me.id?'me':''} ${state.uploader && state.uploader.id===p.id?'owner':''}">
                            ${esc(p.name)} ${state.uploader && state.uploader.id===p.id?'👑':''}
                        </span>
                    `).join('')}
                </div>
                <div class="scores-row">
                    ${Object.entries(state.scores || {}).map(([id, score]) => {
                        const p = state.players.find(p => p.id === id);
                        return p ? `<span class="chip">${esc(p.name)}: ${esc(score)} 🏆</span>` : '';
                    }).join('')}
                </div>
                ${state.winner ? `
                    <div class="celebration-msg" style="display:inline-block; margin-top:8px; background:var(--yellow); border:2px solid var(--ink); border-radius:30px; padding:8px 20px; font-weight:700; box-shadow:0 4px 0 var(--ink);">
                        🏆 الفائز: ${esc(state.players.find(p=>p.id===state.winner)?.name || 'غير معروف')}
                    </div>
                ` : ''}
            </div>
            <div class="panel">
                ${state.imageUrl ? `<div class="game-img-wrap"><img src="${escAttr(state.imageUrl)}" alt="صورة التحدي"></div>` : ''}
                ${isUploader ? `<div class="desc-card">${esc(state.description || 'لا يوجد وصف')}</div>` : ''}
                <div class="divider"></div>
                ${isUploader ? `
                    <div style="font-weight:700; margin-bottom:10px; color:var(--blue); text-align:right;">الحل عندك: <span style="color:var(--ink); background:var(--yellow); padding:2px 10px; border-radius:20px;">${esc(state.cartoonName)}</span></div>
                    <div class="divider"></div>
                    <div style="text-align:center; font-weight:700; color:#666; margin-bottom:10px;">تخمينات اللاعبين (${(state.guesses||[]).length}):</div>
                    ${(state.guesses||[]).length === 0 ? '<div class="waiting-msg">لا توجد تخمينات بعد...<span class="spinner"></span></div>' : ''}
                    ${(state.guesses||[]).map(g => `
                        <div class="guess-item">
                            <div>
                                <span style="font-weight:800; color:var(--blue);">${esc(g.playerName)}:</span>
                                <span class="guess-text ${g.status==='correct'?'correct':(g.status==='wrong'?'wrong':'')}">${esc(g.text)}</span>
                            </div>
                            <div class="verdict-btns">
                                ${g.status==='pending' ? `
                                    <button class="btn green small" data-action="verdict" data-player-id="${escAttr(g.playerId)}" data-verdict="correct" ${state.winner ? 'disabled style="opacity:0.5; cursor:not-allowed;"' : ''}>✅ صح</button>
                                    <button class="btn red small" data-action="verdict" data-player-id="${escAttr(g.playerId)}" data-verdict="wrong" ${state.winner ? 'disabled style="opacity:0.5; cursor:not-allowed;"' : ''}>❌ خطأ</button>
                                ` : g.status==='wrong' ? `
                                    <span class="badge-tag">خاطئ ❌</span>
                                    ${!state.winner ? `<button class="btn undo small" data-action="undo-verdict" data-player-id="${escAttr(g.playerId)}" title="تراجع">↩️ تراجع</button>` : ''}
                                ` : `
                                    <span class="badge-tag">صحيح ✅</span>
                                `}
                            </div>
                        </div>
                    `).join('')}
                    ${state.winner ? `<button class="btn green" onclick="nextRound()" style="margin-top:12px;">الجولة التالية ➡️</button>` : ''}
                ` : `
                    ${myGuessObj ? `
                        <div style="text-align:center; font-weight:700; margin-bottom:14px;">
                            تخمينك الحالي: <span style="color:var(--blue); background:var(--yellow); padding:2px 10px; border-radius:20px;">${esc(myGuessObj.text)}</span>
                            <div style="margin-top:6px;"><span class="badge-tag">${myGuessObj.status==='pending'?'بانتظار تقييم المنشئ...':(myGuessObj.status==='correct'?'إجابة صحيحة! 🎉':'إجابة خاطئة ❌')}</span></div>
                        </div>
                        ${myGuessObj.status==='wrong' && !state.winner ? `
                            <button class="btn blue" onclick="resetMyGuess()">محاولة تخمين جديدة 🔄</button>
                        ` : ''}
                        ${myGuessObj.status==='correct' ? `
                            <div style="text-align:center; font-weight:700; color:var(--green); padding:14px; background:#EAF6EF; border:2px solid var(--green); border-radius:16px;">🎉 إجابة صحيحة! انتظر الجولة التالية</div>
                        ` : ''}
                        ${myGuessObj.status==='pending' ? `
                            <div class="waiting-msg">بانتظار تقييم المنشئ...<span class="spinner"></span></div>
                        ` : ''}
                    ` : (state.winner ? `
                        <div class="waiting-msg" style="padding: 30px 0;">
                            🏁 انتهت الجولة!<br>
                            <span style="font-size:0.9rem; color:#888;">بانتظار المنشئ للبدء بالجولة التالية...</span>
                        </div>
                    ` : `
                        <label>ما هو اسم هذا الكرتون؟</label>
                        ${lastWrongGuessText ? `<div style="font-size:0.8rem; color:#888; margin-bottom:8px; text-align:center;">تخمينك السابق: <span style="background:#FFEAEA; padding:2px 8px; border-radius:12px; color:var(--primary-dark); text-decoration:line-through;">${esc(lastWrongGuessText)}</span> — جرّب مرة أخرى</div>` : ''}
                        <input type="text" id="myGuessInput" placeholder="اكتب تخمينك هنا..." value="${escAttr(currentGuessInputVal || lastWrongGuessText)}" oninput="currentGuessInputVal=this.value;" autocomplete="off" style="text-align:center; font-size:1.1rem;">
                        <button class="btn yellow" onclick="submitGuess()">إرسال التخمين 🎯</button>
                    `)}
                `}
            </div>
        `;
        if (!isUploader && !myGuessObj && !state.winner) {
            setTimeout(() => {
                const input = document.getElementById('myGuessInput');
                if (input) { input.focus(); input.select(); }
            }, 100);
        }
        return;
    }
}

// ===================================================================
// ===== مستمع لوحة المفاتيح =====
// ===================================================================
document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        const authUser = document.getElementById('authUsername');
        const roomInput = document.getElementById('roomCodeInput');
        const guessInput = document.getElementById('myGuessInput');
        if (authUser && document.activeElement === authUser) return;
        if (roomInput && document.activeElement === roomInput) joinRoom();
        else if (guessInput && document.activeElement === guessInput) submitGuess();
    }
});
</script>
</body>
</html>
