<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خمّن الكرتون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFF6E5;
    --ink:#1B1B1B;
    --pop-red:#E6473C;
    --pop-yellow:#FFC93C;
    --pop-blue:#3D8BD4;
    --pop-green:#4CAF7D;
    --panel-shadow: 6px 6px 0 var(--ink);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Cairo',sans-serif;
    background-color: var(--paper);
    background-image:
      radial-gradient(var(--ink) 1px, transparent 1.2px);
    background-size: 18px 18px;
    background-position: -9px -9px;
    color: var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:20px 14px 60px;
  }
  .app{ width:100%; max-width:560px; }
  h1.logo{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:2.4rem;
    text-align:center;
    color:var(--ink);
    margin:6px 0 2px;
    letter-spacing:1px;
  }
  h1.logo span{ color:var(--pop-red); }
  .tagline{
    text-align:center;
    font-weight:600;
    color:#555;
    margin-bottom:22px;
    font-size:0.95rem;
  }
  .panel{
    background:#fff;
    border:3px solid var(--ink);
    border-radius:16px;
    box-shadow: var(--panel-shadow);
    padding:22px 20px;
    margin-bottom:18px;
  }
  .panel.tilt{ transform: rotate(-0.6deg); }
  label{
    display:block;
    font-weight:700;
    margin-bottom:6px;
    font-size:0.92rem;
  }
  input[type=text], input[type=password], textarea{
    width:100%;
    font-family:'Cairo',sans-serif;
    font-size:1rem;
    padding:12px 14px;
    border:2.5px solid var(--ink);
    border-radius:10px;
    margin-bottom:14px;
    background:var(--paper);
    box-shadow:3px 3px 0 var(--ink);
  }
  textarea{ resize:vertical; }
  input[type=text]:focus, input[type=password]:focus, textarea:focus{ outline:3px solid var(--pop-blue); outline-offset:1px; }
  .btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:1.05rem;
    padding:12px 22px;
    border:3px solid var(--ink);
    border-radius:12px;
    cursor:pointer;
    background:var(--pop-yellow);
    color:var(--ink);
    box-shadow:4px 4px 0 var(--ink);
    transition: transform .08s ease;
    width:100%;
  }
  .btn:active{ transform: translate(3px,3px); box-shadow:1px 1px 0 var(--ink); }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }
  .btn.red{ background:var(--pop-red); color:#fff; }
  .btn.green{ background:var(--pop-green); color:#fff; }
  .btn.blue{ background:var(--pop-blue); color:#fff; }
  .btn.small{ width:auto; font-size:0.85rem; padding:8px 14px; box-shadow:3px 3px 0 var(--ink); }
  .row{ display:flex; gap:10px; }
  .row .btn{ flex:1; }
  .code-badge{
    display:inline-block;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.5rem;
    letter-spacing:4px;
    background:var(--pop-blue);
    color:#fff;
    border:3px solid var(--ink);
    border-radius:10px;
    padding:6px 18px;
    box-shadow:3px 3px 0 var(--ink);
  }
  .center{ text-align:center; }
  .players{ display:flex; flex-wrap:wrap; gap:8px; margin:14px 0; }
  .chip{
    background:var(--paper);
    border:2px solid var(--ink);
    border-radius:20px;
    padding:5px 14px;
    font-weight:700;
    font-size:0.85rem;
  }
  .chip.me{ background:var(--pop-yellow); }
  .chip.uploader::after{ content:" 🎨"; }
  .divider{ border:none; border-top:2.5px dashed var(--ink); margin:16px 0; opacity:0.5; }
  .game-img-wrap{
    border:3px solid var(--ink);
    border-radius:14px;
    overflow:hidden;
    margin-bottom:16px;
    background:#eee;
  }
  .game-img-wrap img{ width:100%; display:block; }
  .file-drop{
    border:3px dashed var(--ink);
    border-radius:14px;
    padding:26px 14px;
    text-align:center;
    font-weight:700;
    cursor:pointer;
    background:var(--paper);
    margin-bottom:14px;
    box-shadow:3px 3px 0 var(--ink);
  }
  .file-drop.has-img{ padding:0; border-style:solid; overflow:hidden; }
  .file-drop.has-img img{ width:100%; display:block; max-height:220px; object-fit:cover; }
  .guess-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--paper);
    border:2px solid var(--ink);
    border-radius:10px;
    padding:10px 14px;
    margin-bottom:8px;
  }
  .guess-text{ font-weight:700; }
  .guess-text.wrong{ text-decoration:line-through; opacity:0.55; }
  .guess-text.correct{ color:var(--pop-green); }
  .verdict-btns{ display:flex; gap:6px; }
  .verdict-btns .btn{ width:auto; padding:6px 12px; font-size:0.85rem; box-shadow:2px 2px 0 var(--ink); }
  .badge-tag{
    font-size:0.75rem;
    font-weight:700;
    padding:2px 9px;
    border-radius:10px;
    background:#eee;
    border:1.5px solid var(--ink);
  }
  .waiting-msg{ text-align:center; font-weight:700; color:#666; padding:20px 0; }
  .burst{
    text-align:center;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.4rem;
    color:var(--pop-red);
    animation: pop 0.4s ease;
  }
  @keyframes pop{ 0%{ transform:scale(0.6); opacity:0; } 100%{ transform:scale(1); opacity:1; } }
  .error-msg{ color:var(--pop-red); font-weight:700; font-size:0.85rem; margin-top:-8px; margin-bottom:12px; }
  .small-link{ text-align:center; margin-top:10px; }
  .small-link a{ color:#777; font-size:0.85rem; cursor:pointer; text-decoration:underline; }
  .tabs{ display:flex; gap:8px; margin-bottom:18px; }
  .tab-btn{
    flex:1;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:0.95rem;
    padding:10px;
    border:3px solid var(--ink);
    border-radius:12px;
    cursor:pointer;
    background:#fff;
    color:var(--ink);
    box-shadow:4px 4px 0 var(--ink);
    transition: transform .08s ease;
  }
  .tab-btn:active{ transform: translate(3px,3px); box-shadow:1px 1px 0 var(--ink); }
  .tab-btn.active{ background:var(--pop-blue); color:#fff; }
  select{
    width:100%;
    font-family:'Cairo',sans-serif;
    font-size:1rem;
    padding:12px 14px;
    border:2.5px solid var(--ink);
    border-radius:10px;
    margin-bottom:14px;
    background:var(--paper);
    box-shadow:3px 3px 0 var(--ink);
  }
  .cartoon-picks{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .cartoon-chip{
    border:2.5px solid var(--ink);
    border-radius:16px;
    padding:7px 14px;
    font-weight:700;
    font-size:0.85rem;
    cursor:pointer;
    background:#fff;
    box-shadow:3px 3px 0 var(--ink);
    transition: transform .08s ease;
  }
  .cartoon-chip:active{ transform: translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
  .cartoon-chip.selected{ background:var(--pop-yellow); }
  .add-chip{
    border:2.5px dashed var(--ink) !important;
    background:var(--pop-yellow) !important;
    box-shadow:3px 3px 0 var(--ink);
  }
  .desc-card{
    background:#EAF6EF;
    border:2.5px solid var(--pop-green);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:14px;
    white-space:pre-wrap;
    font-size:0.88rem;
    line-height:1.6;
    box-shadow:3px 3px 0 var(--ink);
  }
  .header-wrap{ position:relative; }
  .leave-btn{
    position:absolute;
    top:0;
    left:0;
    display:flex;
    align-items:center;
    gap:5px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:0.8rem;
    color:#fff;
    cursor:pointer;
    background:var(--pop-red);
    border:2.5px solid var(--ink);
    border-radius:20px;
    padding:6px 14px;
    box-shadow:3px 3px 0 var(--ink);
    transition: transform .08s ease;
  }
  .leave-btn:active{ transform: translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
</style>

</head>
<body>
<div class="app" id="app"></div>

<script>
const STORAGE_PREFIX = 'cartoon-room:';
const USER_STORAGE_PREFIX = 'cartoon-user:';
let account = null;    // {id, username}
let me = null;          // {id, name}
let roomCode = null;
let state = null;       // shared room state
let pollTimer = null;
let uploadedImageData = null; // temp base64 while filling upload form
let entryMode = 'create'; // 'create' | 'join'
let showPresets = false;
let showCustomInput = false;
let draftCartoonName = null;
let customImageData = null;
let draftDescription = null;
let showProfile = false;
let lastKnownRoomScore = 0;

function fmtDesc(f){
  const lines = [];
  if(f.channel) lines.push('القناة: ' + f.channel);
  lines.push('الكوكب (إن كان من سبيستون): ' + (f.planet || 'لا ينطبق'));
  if(f.count) lines.push('عدد الشخصيات الرئيسية: ' + f.count);
  if(f.category) lines.push('التصنيف: ' + f.category);
  if(f.characters) lines.push('الشخصيات: ' + f.characters);
  if(f.story) lines.push('القصة: ' + f.story);
  return lines.join('\n');
}

const CARTOON_PRESETS = [
  {name:'توم آند جيري', description:fmtDesc({channel:'قنوات متعددة حول العالم (دبلجات عربية عدة)', count:'2', category:'كوميدي بلا حوار تقريباً', characters:'توم: قط أبيض وأزرق يحاول الإمساك بجيري باستمرار. جيري: فأر بني ذكي يتفوق على توم دائماً بالحيلة.', story:'مطاردات كوميدية متكررة بين قط وفأر يعيشان في نفس المنزل.'})},
  {name:'بوكيمون', description:fmtDesc({channel:'قنوات متعددة (دبلجة عربية على أكثر من قناة)', count:'3', category:'أنمي مغامرات', characters:'آش كيتشوم: مدرب بوكيمون طموح. بيكاتشو: بوكيمون كهربائي أصفر مخلص لآش. ميستي وبروك: رفقاء رحلة آش.', story:'صبي يسافر لجمع وتدريب مخلوقات بوكيمون وخوض بطولات ليصبح أفضل مدرب.'})},
  {name:'دراغون بول', description:fmtDesc({channel:'قنوات متعددة (دبلجة عربية على أكثر من قناة)', count:'4', category:'أنمي أكشن وقتال', characters:'غوكو: مقاتل ساذج القلب هائل القوة. فيجيتا: أمير سايان منافس غوكو. بولما: عالمة مخترعة صديقة غوكو. بيكولو: مقاتل غامض يتحول لحليف.', story:'مقاتل يبحث عن كرات التنين السحرية ويواجه أعداء أقوى مع تطور قوته باستمرار.'})},
  {name:'سبونج بوب', description:fmtDesc({channel:'قنوات متعددة حول العالم', count:'4', category:'كوميدي', characters:'سبونج بوب: إسفنجة بحرية مرحة تعمل بمطعم كراستي كراب. باتريك: نجم بحر كسول صديق سبونج بوب. سكويدوارد: أخطبوط عصبي جار سبونج بوب. السيد كرابز: صاحب المطعم البخيل.', story:'إسفنجة بحرية مرحة تعيش مغامرات يومية في مدينة بيكيني بوتوم تحت الماء.'})},
  {name:'بن تن', description:fmtDesc({channel:'قنوات متعددة حول العالم', planet:'لا ينطبق (ليس من سبيستون كأصل، لكن أشكال بن الفضائية تنتمي لكواكب مختلفة)', count:'2', category:'أكشن وخيال علمي', characters:'بن تينيسون: صبي يمتلك ساعة أومنيتركس الفضائية. جوين: ابنة عم بن تساعده بمغامراته.', story:'صبي يجد ساعة فضائية تحوّله إلى مخلوقات غريبة ذات قوى خارقة يحارب بها الأشرار.'})},
  {name:'سكوبي دو', description:fmtDesc({channel:'قنوات متعددة حول العالم', count:'5', category:'كوميدي وغموض', characters:'سكوبي دو: كلب جبان يحب الطعام. شاغي: صديق سكوبي الجبان أيضاً. فريد وديفني وفيلما: بقية أفراد فريق التحقيق.', story:'مجموعة أصدقاء وكلبهم يحلون ألغاز أشباح وأحداث غامضة في كل حلقة.'})},
  {name:'المهرج تيتو', description:fmtDesc({channel:'دبلجة عربية على قنوات أطفال متعددة', count:'غير مؤكد بدقة', category:'كوميدي', characters:'تيتو: مهرج غريب الأطوار محور القصة، محاط بحيوانات وشخصيات ناطقة.', story:'مغامرات كوميدية يومية لمهرج غريب الأطوار مع أصدقائه من الحيوانات.'})},
  {name:'ريمي', description:fmtDesc({channel:'دبلجة عربية على قنوات أطفال متعددة', count:'2', category:'دراما ومغامرة', characters:'ريمي: طفل يتيم يتنقل بحثاً عن عائلته. فيتاليس: عازف مسنّ يتبنى ريمي ويرافقه بالرحلة.', story:'طفل يتيم يتنقل من مكان لآخر ويعيش مغامرات مؤثرة بحثاً عن أهله وعائلته الحقيقية.'})},
  {name:'غرندايزر', description:fmtDesc({channel:'دبلجة عربية على قنوات متعددة (اشتهر قديماً)', planet:'كوكب فيغا (موطن البطل الأصلي قبل تدميره من الغزاة)', count:'3', category:'أنمي خيال علمي وروبوتات', characters:'ديوك فليمنغ (أكتيون): قائد الروبوت غرندايزر. الأميرة ريحانة: مساعدة قريبة من البطل. الدكتور بروكيت: عالم يدعم البطل بالتقنية.', story:'روبوت فضائي عملاق يقوده بطل غريب عن كوكب الأرض للدفاع عنها من غزو فضائي معادٍ.'})},
  {name:'كابتن ماجد', description:fmtDesc({channel:'دبلجة عربية على قنوات متعددة (اشتهر عبر سبيستون)', count:'3', category:'أنمي رياضي', characters:'ماجد (تسوباسا): لاعب كرة قدم موهوب يحلم بالاحتراف. عاصم (وكابايشي): حارس مرمى صديق ماجد ومنافسه أحياناً. طارق (هيوغا): مهاجم قوي التسديد.', story:'لاعب كرة قدم صغير يسعى لتحقيق حلمه بالاحتراف من خلال البطولات المدرسية والدولية.'})},
  {name:'عدنان ولينا', description:fmtDesc({channel:'دبلجة عربية على قنوات متعددة (اشتهر عبر سبيستون)', count:'2', category:'أنمي مغامرة وخيال علمي', characters:'عدنان: صبي يعيش بجزيرة معزولة بعد كارثة عالمية. لينا: فتاة صغيرة يحميها عدنان ويبحثان معاً عن كنز وأمان.', story:'طفلان يعيشان بعد كارثة عالمية أغرقت أغلب اليابسة، ويخوضان مغامرة بحثاً عن كنز مفقود وحياة آمنة.'})},
  {name:'سالي', description:fmtDesc({channel:'دبلجة عربية على قنوات متعددة (اشتهر عبر سبيستون)', count:'2', category:'أنمي سحر وفانتازيا', characters:'سالي: أميرة صغيرة من عالم السحر تعيش بين البشر متخفية. كاباو وموري: مساعدا سالي الساحران الصغيران.', story:'أميرة ساحرة صغيرة تعيش بين البشر متخفية وتتعلم استخدام قواها السحرية بحكمة ومسؤولية.'})},
  {name:'الفتيات الخارقات', description:fmtDesc({channel:'قنوات متعددة حول العالم', count:'3', category:'أكشن وكوميدي', characters:'بلوسم: قائدة الفتيات الخارقات وأكثرهن تنظيماً. بابلز: الأكثر لطفاً ومرحاً بينهن. باتركب: الأكثر شراسة وقوة بدنية.', story:'ثلاث فتيات صغيرات اكتسبن قوى خارقة بالصدفة ويستخدمنها لحماية مدينتهن من الأشرار.'})},
  {name:'ناروتو', description:fmtDesc({channel:'قنوات متعددة (دبلجة عربية على أكثر من قناة)', count:'3', category:'أنمي أكشن ونينجا', characters:'ناروتو: نينجا صغير يحلم بأن يصبح زعيم قريته. ساسكي: زميل ناروتو الموهوب المهووس بالانتقام. ساكورا: زميلتهما الذكية المتدربة على الطب النينجا.', story:'نينجا صغير يرفضه أهل قريته في البداية، لكنه يسعى بإصرار ليصبح زعيم القرية المعترف به من الجميع.'})},
  {name:'ون بيس', description:fmtDesc({channel:'قنوات متعددة (دبلجة عربية على أكثر من قناة)', count:'4', category:'أنمي مغامرة وقراصنة', characters:'لوفي: قبطان طاقم قبعة القش يمتلك قدرة جسد المطاط. زورو: مقاتل بثلاثة سيوف قوي الإخلاص. نامي: ملاحة الطاقم الذكية. سانجي: طباخ الطاقم البارع بالقتال بالرجل.', story:'قراصنة يبحرون معاً بحثاً عن كنز أسطوري يدعى "ون بيس" ليصبح قائدهم ملك القراصنة.'})},
  {name:'ميكي ماوس', description:fmtDesc({channel:'قنوات متعددة حول العالم', count:'3', category:'كوميدي عائلي', characters:'ميكي ماوس: فأر مرح متفائل محور القصص. ميني ماوس: صديقة ميكي المقربة. دونالد داك: صديق ميكي سريع الغضب.', story:'فأر كرتوني كلاسيكي يعيش مغامرات يومية بسيطة ومرحة مع أصدقائه.'})},
  {name:'بينوكيو', description:fmtDesc({channel:'أفلام ونسخ تلفزيونية متعددة', count:'2', category:'فانتازيا كلاسيكية', characters:'بينوكيو: دمية خشبية تحلم أن تصبح طفلاً حقيقياً. جيبيتو: النجار العجوز الذي صنع بينوكيو وتبناه كابن.', story:'دمية خشبية تنبض بالحياة وتخوض مغامرات لتتعلم الصدق وتستحق أن تصبح طفلاً حقيقياً.'})},
  {name:'الأميرة والضفدع', description:fmtDesc({channel:'فيلم سينمائي (وليس مسلسلاً)', count:'2', category:'فانتازيا وموسيقي', characters:'تيانا: فتاة طموحة تحلم بامتلاك مطعمها الخاص. الأمير نافين: أمير تحول إلى ضفدع بلعنة سحرية.', story:'فتاة تقبّل ضفدعاً هو في الحقيقة أمير مسحور، فتتحول هي أيضاً لضفدعة وتخوضان مغامرة لفك اللعنة.'})},
  {name:'سنافر', description:fmtDesc({channel:'قنوات متعددة حول العالم', count:'3', category:'كوميدي وفانتازيا', characters:'الزعيم الأحمر: قائد قرية السنافر الحكيم. السنفورة: السنفورة الوحيدة الأنثى بالقرية. غرغامel: الساحر الشرير الذي يطارد السنافر.', story:'مخلوقات زرقاء صغيرة تعيش بقرية هادئة بالغابة وتواجه باستمرار مطاردة ساحر شرير يريد الإمساك بها.'})},
  {name:'بامبي', description:fmtDesc({channel:'فيلم سينمائي (وليس مسلسلاً)', count:'3', category:'دراما عائلية', characters:'بامبي: غزال صغير يكبر بالغابة. تمبر: أرنب صديق بامبي المرح. فلاور: ظربان خجول صديق بامبي.', story:'غزال صغير يكبر في الغابة بين الفصول الأربعة ويتعلم دروساً عن الحياة والصداقة والخسارة.'})},
